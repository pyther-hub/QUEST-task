<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FNO Darcy demo</title>
<style>
  :root { --bg: #fafafa; --fg: #1d1d1f; --muted: #6e6e73; --card: #fff; --line: #e3e3e6; --warn-bg: #fff4e5; --warn-fg: #8a4b00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --fg: #ececee; --muted: #9a9aa0; --card: #1f1f22; --line: #333338; --warn-bg: #3a2a12; --warn-fg: #ffcc80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg);
         font: 14px/1.45 system-ui, -apple-system, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--fg); color: var(--bg); cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  input { font: inherit; width: 90px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line);
          background: var(--card); color: var(--fg); }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-weight: 600;
           background: var(--warn-bg); color: var(--warn-fg); }
  #status { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  figure { margin: 0; padding: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  figcaption { font-weight: 600; margin-bottom: 6px; }
  figcaption small { font-weight: 400; color: var(--muted); }
  canvas.map { width: 100%; aspect-ratio: 1; image-rendering: pixelated; display: block; }
  canvas.bar { width: 100%; height: 10px; display: block; margin-top: 6px; }
  .range { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .metric { margin-top: 12px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>FNO Darcy-flow surrogate</h1>
  <p class="sub">−∇·(a∇u) = 1 on the unit square, 64×64 grid. Reference u from the finite-volume solver in <code>src/data/darcy.py</code>.</p>
  <div class="controls">
    <button id="new">New sample</button>
    <label>seed <input id="seed" type="number" min="0" value="0"></label>
    <span class="badge">Predictions: untrained (random weights)</span>
    <span id="status"></span>
  </div>
  <div class="grid" id="panels"></div>
  <p class="metric" id="metric"></p>
</main>
<script>
// Colormap stops sampled from matplotlib's viridis / magma / inferno (same maps as src/infer.py).
const CMAPS = {
  viridis: ["#440154","#482878","#3e4a89","#31688e","#26828e","#1f9e89","#35b779","#6ece58","#b5de2b","#fde725"],
  magma:   ["#000004","#180f3d","#440f76","#721f81","#9e2f7f","#cd4071","#f1605d","#fd9668","#feca8d","#fcfdbf"],
  inferno: ["#000004","#1b0c41","#4a0c6b","#781c6d","#a52c60","#cf4446","#ed6925","#fb9b06","#f7d13d","#fcffa4"],
};
const PANELS = [
  { key: "a",    title: "permeability a(x)", cmap: "viridis" },
  { key: "u",    title: "reference u(x)",    cmap: "magma" },
  { key: "pred", title: "predicted u(x)",    note: "untrained (random weights)", cmap: "magma" },
  { key: "err",  title: "|error|",           note: "|predicted − reference|", cmap: "inferno" },
];
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const LUT = Object.fromEntries(Object.entries(CMAPS).map(([k, stops]) => {
  const s = stops.map(rgb), lut = new Uint8ClampedArray(256 * 3);
  for (let i = 0; i < 256; i++) {
    const t = i / 255 * (s.length - 1), j = Math.min(Math.floor(t), s.length - 2), f = t - j;
    for (let c = 0; c < 3; c++) lut[i * 3 + c] = s[j][c] + (s[j + 1][c] - s[j][c]) * f;
  }
  return [k, lut];
}));

const fmt = v => Math.abs(v) >= 1e-2 && Math.abs(v) < 1e3 ? v.toFixed(3) : v.toExponential(2);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; return e; };

const canvases = {};
for (const p of PANELS) {
  const fig = el("figure");
  fig.append(el("figcaption", "", p.title + (p.note ? ` <small>${p.note}</small>` : "")));
  const map = el("canvas", "map"), bar = el("canvas", "bar"), range = el("div", "range");
  map.width = map.height = 64; bar.width = 256; bar.height = 1;
  fig.append(map, bar, range);
  document.getElementById("panels").append(fig);
  canvases[p.key] = { map, range, cmap: p.cmap };
  const bctx = bar.getContext("2d"), img = bctx.createImageData(256, 1), lut = LUT[p.cmap];
  for (let i = 0; i < 256; i++) img.data.set([lut[i*3], lut[i*3+1], lut[i*3+2], 255], i * 4);
  bctx.putImageData(img, 0, 0);
}

function draw(key, field) {
  const { map, range, cmap } = canvases[key], lut = LUT[cmap];
  const flat = field.flat(), lo = Math.min(...flat), hi = Math.max(...flat), span = hi - lo || 1;
  const ctx = map.getContext("2d"), img = ctx.createImageData(64, 64);
  flat.forEach((v, i) => {
    const k = Math.round((v - lo) / span * 255) * 3;
    img.data.set([lut[k], lut[k+1], lut[k+2], 255], i * 4);
  });
  ctx.putImageData(img, 0, 0);
  range.innerHTML = `<span>${fmt(lo)}</span><span>${fmt(hi)}</span>`;
}

async function json(res) {
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}

const btn = document.getElementById("new"), seedIn = document.getElementById("seed");
const status = document.getElementById("status"), metric = document.getElementById("metric");

async function run(seed) {
  btn.disabled = true; status.textContent = "solving…";
  try {
    const s = await json(await fetch(`/sample?seed=${seed}`));
    draw("a", s.a); draw("u", s.u);
    status.textContent = "predicting…";
    const { u: pred } = await json(await fetch("/predict", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ a: s.a }),
    }));
    const err = pred.map((row, i) => row.map((v, j) => Math.abs(v - s.u[i][j])));
    draw("pred", pred); draw("err", err);
    const sq = f => Math.sqrt(f.flat().reduce((t, v) => t + v * v, 0));
    metric.textContent = `seed ${seed} · relative L2 error ${fmt(sq(err) / sq(s.u))} (untrained (random weights) — expect a large error)`;
    status.textContent = "";
  } catch (e) {
    status.textContent = "error: " + e.message;
  } finally {
    btn.disabled = false;
  }
}

btn.onclick = () => { const s = Math.floor(Math.random() * 1e6); seedIn.value = s; run(s); };
seedIn.onchange = () => run(Math.max(0, parseInt(seedIn.value) || 0));
fetch("/health").then(json).then(h => {
  if (!h.model_loaded) status.textContent = `no model loaded (${h.checkpoint}) — run: python -m app.model`;
}).catch(() => {});
run(0);
</script>
</body>
</html>
